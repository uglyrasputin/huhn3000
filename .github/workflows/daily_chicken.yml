name: Daily Chicken Quotes

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fresh chicken quotes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q google-genai
          python3 - << 'EOF'
          import os, time
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"].strip())
          prompt = "Schreibe genau 8 kurze, lustige, kreative Gedanken oder Sprueche aus Sicht von Huehnern mit schwarzem Humor im Huehnerstall auf Deutsch. Maximal 60 Zeichen pro Zeile! Nur ue, ae, oe, ss verwenden (keine Umlaute, keine Emojis, keine Nummerierung, nur die 8 Zeilen)."

          # Alle verfügbaren Modelle für diesen Key automatisch ermitteln
          available = []
          try:
              for m in client.models.list():
                  name = getattr(m, "name", "")
                  if "flash" in name.lower() or "gemma" in name.lower():
                      available.append(name.replace("models/", ""))
          except Exception as e:
              print("Konnte Modellliste nicht laden:", e)

          if "gemini-3.8-flash" not in available:
              available.insert(0, "gemini-3.8-flash")

          print("Gefundene Modelle:", available)

          lines = []
          for model_name in available:
              try:
                  print("Versuche:", model_name)
                  response = client.models.generate_content(model=model_name, contents=prompt)
                  lines = [l.strip()[:62] for l in response.text.splitlines() if l.strip()]
                  if len(lines) >= 4:
                      print("Erfolg mit:", model_name)
                      break
              except Exception as e:
                  print(f"Warnung bei {model_name}: {e}")
                  time.sleep(2)

          if len(lines) < 4:
              lines = [
                  "Bock, bock! Alles ruhig hier...",
                  "Wo bleibt mein Koerner-Fruehstueck?",
                  "Ich bewache heute das Nest!",
                  "Frische Eier im Anmarsch!",
                  "Wer hat den Fuchs gesehen?",
                  "Gack! Sonne oder Stall?",
                  "Alle auf die Schlafstange!",
                  "Heute legen wir Weltrekord!"
              ]

          with open("sprueche.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines[:8]) + "\n")
          EOF

      - name: Save sprueche.txt to repo
        run: |
          git config user.name "HUHN-3000-Bot"
          git config user.email "bot@huhn3000.local"
          git add sprueche.txt
          git commit -m "Update daily chicken quotes" || exit 0
          git pull --rebase origin main
          git push

