name: Daily Chicken Quotes

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fresh chicken quotes via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CLEAN_KEY=$(echo -n "$GEMINI_API_KEY" | tr -d '[:space:]')
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            "https://googleapis.com" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $CLEAN_KEY" \
            -d '{"contents":[{"parts":[{"text":"Schreibe genau 8 kurze, lustige, kreative Gedanken oder Sprueche aus Sicht von Huehnern im Huehnerstall auf Deutsch. Maximal 32 Zeichen pro Zeile! Nur ue, ae, oe, ss verwenden (keine Umlaute, keine Emojis, keine Nummerierung, nur die 8 Zeilen)."}]}]}' \
            -o response.json

          cat response.json

          python3 - << 'EOF'
          import json
          with open("response.json", "r", encoding="utf-8") as f:
              res = json.load(f)
          if "candidates" not in res:
              raise SystemExit(1)
          cand = res.get("candidates").pop(0)
          part = cand.get("content").get("parts").pop(0)
          text = part.get("text").strip()
          lines = [l.strip()[:34] for l in text.splitlines() if l.strip()]
          with open("sprueche.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines[:8]) + "\n")
          EOF

          rm -f response.json

      - name: Save sprueche.txt to repo
        run: |
          git config user.name "HUHN-3000-Bot"
          git config user.email "bot@huhn3000.local"
          git add sprueche.txt
          git commit -m "Update daily chicken quotes" || exit 0
          git push
